# Sealed build: pack-only workflow for the org.webjars.npm:xmldom WebJar.
# The test suite runs on Travis (.travis.yml -> npm test -> t/test + t/vows).
# The WebJar is the npm tarball re-rooted under
# META-INF/resources/webjars/xmldom/<version>/ plus the two WebJar Sync
# descriptors (written below), zipped without a MANIFEST.MF.
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '12'

      - name: npm pack
        run: |
          node --version
          npm --version
          npm pack
          ls -l xmldom-*.tgz

      - name: Assemble WebJar
        run: |
          set -eu
          NAME=xmldom
          VERSION=$(node -p "require('./package.json').version")
          TGZ="$PWD/$NAME-$VERSION.tgz"
          OUT="$PWD/webjar-out"
          ROOT=$(mktemp -d)
          mkdir -p "$OUT"
          cd "$ROOT"
          WJ="META-INF/resources/webjars/$NAME/$VERSION"
          MV="META-INF/maven/org.webjars.npm/$NAME"
          mkdir -p "$WJ" "$MV" unpack
          tar -xzf "$TGZ" -C unpack
          cp -a unpack/package/. "$WJ/"
          rm -rf unpack
          # WebJar Sync descriptors (byte-exact copies of the public jar's; '~' marks
          # whitespace-only lines, since trailing whitespace does not survive the patch)
          cat > "$MV/pom.xml" <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/maven-v4_0_0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <packaging>jar</packaging>
              <groupId>org.webjars.npm</groupId>
              <artifactId>xmldom</artifactId>
              <version>0.1.31</version>
              <name>xmldom</name>
              <description>WebJar for xmldom</description>
              <url>https://www.webjars.org</url>

              <properties>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <scm>
                  <url>https://github.com/xmldom/xmldom</url>
                  <connection>https://github.com/xmldom/xmldom.git</connection>
                  <developerConnection>https://github.com/xmldom/xmldom.git</developerConnection>
                  <tag>v0.1.31</tag>
              </scm>

              <developers>
                  <developer>
                      <id>webjars</id>
                      <url>https://www.webjars.org</url>
                  </developer>
              </developers>

              <licenses>
                  ~
                  <license>
                      <name>LGPL-2.0</name>
                      <url>https://spdx.org/licenses/LGPL-2.0#licenseText</url>
                      <distribution>repo</distribution>
                  </license>
                  ~
                  <license>
                      <name>MIT</name>
                      <url>https://spdx.org/licenses/MIT#licenseText</url>
                      <distribution>repo</distribution>
                  </license>
                  ~
              </licenses>

              ~
              <issueManagement>
                  <url>https://github.com/xmldom/xmldom/issues</url>
              </issueManagement>
              ~

              <dependencies>
                  ~
                  ~
              </dependencies>

          </project>
          POM
          sed -i 's/~$//' "$MV/pom.xml"
          printf '\n#Generated by WebJar Sync\nversion=%s\ngroupId=org.webjars.npm\nartifactId=%s\n       ' "$VERSION" "$NAME" > "$MV/pom.properties"
          echo "9bc1b2630b1bf36c9adec6b0b8b7b1c0  $MV/pom.xml" | md5sum -c -
          echo "2d0baedec4e9639bfe6acc0320990fb5  $MV/pom.properties" | md5sum -c -
          JAR="$OUT/$NAME-$VERSION.jar"
          # the five directory entries the public WebJar carries, then every file
          # with no further directory entries (-D) and no extra attributes (-X)
          zip -X -q "$JAR" META-INF/ META-INF/resources/ META-INF/resources/webjars/ \
            "META-INF/resources/webjars/$NAME/" "$WJ/"
          { echo "$MV/pom.xml"; echo "$MV/pom.properties"; find "$WJ" -type f | sort; } \
            | zip -X -q -D "$JAR" -@
          unzip -l "$JAR"
          files=$(tar -tzf "$TGZ" | grep -vc '/$')
          entries=$(unzip -Z1 "$JAR" | wc -l)
          echo "tarball files=$files jar entries=$entries"
          test "$entries" -eq $((files + 7))
          if unzip -Z1 "$JAR" | grep -q 'MANIFEST.MF'; then echo "unexpected MANIFEST.MF"; exit 1; fi
          if unzip -Z1 "$JAR" | grep -q '\.github'; then echo "unexpected .github entry"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: xmldom-webjar
          path: webjar-out/xmldom-*.jar
          if-no-files-found: error
